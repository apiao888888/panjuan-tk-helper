name: 编译判官TK助手 APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # 允许在 GitHub 网页上手动触发

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 配置 JDK 17
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 配置 Android SDK
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      # 4. 自动补全 gradle-wrapper.jar（如果仓库中没有）
      - name: 准备 Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "下载 gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            cp /tmp/gradle-8.2/lib/plugins/gradle-wrapper-*.jar gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
            wget -q https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
            echo "✅ gradle-wrapper.jar 准备完成"
          fi
          chmod +x ./gradlew

      # 5. 编译 Debug APK（同时把完整日志保存到文件）
      - name: 编译 Debug APK
        id: build_debug
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build-log.txt

      # 6. 把错误日志贴到 Step Summary（公开可见，不需登录）
      - name: 显示编译错误（如果失败）
        if: always()
        run: |
          echo "## 构建日志（最后 200 行）" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 200 build-log.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "无日志" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # 7. 上传完整构建日志（artifact 公开仓库不需登录即可下载）
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          retention-days: 30

      # 8. 编译 Release APK（未签名）
      - name: 编译 Release APK
        if: steps.build_debug.outcome == 'success'
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      # 9. 上传 Debug APK 作为构建产物
      - name: 上传 Debug APK
        if: steps.build_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: 判官TK助手-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 10. 上传 Release APK
      - name: 上传 Release APK
        if: steps.build_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: 判官TK助手-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      # 11. 让 job 整体反映编译结果
      - name: 检查编译结果
        if: always()
        run: |
          if [ "${{ steps.build_debug.outcome }}" != "success" ]; then
            echo "❌ Debug APK 编译失败"
            exit 1
          fi
          echo "🎉 编译完成！"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; || echo "未找到 APK"
